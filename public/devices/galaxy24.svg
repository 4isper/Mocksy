<svg xmlns="http://www.w3.org/2000/svg" width="360" height="780" viewBox="0 0 360 780" fill="none">
  <!-- Galaxy S24 overlay at its real logical size (360x780). Uniform thin
       bezel, centered punch-hole front camera, tighter screen corners (~22pt)
       with the still-somewhat-squared body corners characteristic of Galaxy. -->
  <defs>
    <linearGradient id="bezelGalaxy" x1="0" y1="0" x2="0" y2="780" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#707076"/>
      <stop offset="1" stop-color="#202023"/>
    </linearGradient>
    <linearGradient id="edgeHi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,0.36)"/>
      <stop offset="0.45" stop-color="rgba(255,255,255,0.05)"/>
      <stop offset="1" stop-color="rgba(0,0,0,0.28)"/>
    </linearGradient>
    <mask id="screenGalaxy">
      <rect x="0" y="0" width="360" height="780" fill="white"/>
      <rect x="12" y="12" width="336" height="756" rx="22" ry="22" fill="black"/>
    </mask>
  </defs>
  <!-- Outer body (squared corners distinctive to Galaxy) -->
  <rect x="4" y="4" width="352" height="772" rx="26" ry="26" fill="url(#bezelGalaxy)" stroke="#0a0a0a" stroke-width="2" mask="url(#screenGalaxy)"/>
  <!-- Screen edge rim: bright top / dark bottom -->
  <rect x="12" y="12" width="336" height="756" rx="22" ry="22" fill="none" stroke="url(#edgeHi)" stroke-width="1.5"/>
  <!-- Earpiece slit (top center) -->
  <rect x="156" y="7" width="48" height="4" rx="2" fill="#0a0a0a"/>
  <!-- Centered punch-hole camera -->
  <circle cx="180" cy="30" r="6" fill="#0a0a0a"/>
  <circle cx="180" cy="30" r="3.5" fill="#1c1c1e"/>
  <circle cx="180" cy="30" r="1.4" fill="#0a0a0a"/>
  <!-- Power / Bixby button (right) -->
  <rect x="356" y="180" width="4" height="50" rx="2" fill="#4a4a4f"/>
  <rect x="356" y="248" width="4" height="28" rx="2" fill="#4a4a4f"/>
  <!-- Volume buttons (left) -->
  <rect x="0" y="168" width="4" height="26" rx="2" fill="#4a4a4f"/>
  <rect x="0" y="206" width="4" height="26" rx="2" fill="#4a4a4f"/>
  <!-- Antenna break lines in the frame rails -->
  <g stroke="rgba(255,255,255,0.10)" stroke-width="1.2">
    <line x1="8" y1="120" x2="8" y2="150"/>
    <line x1="8" y1="630" x2="8" y2="660"/>
    <line x1="352" y1="120" x2="352" y2="150"/>
    <line x1="352" y1="630" x2="352" y2="660"/>
  </g>
</svg>
