<svg xmlns="http://www.w3.org/2000/svg" width="402" height="874" viewBox="0 0 402 874" fill="none">
  <!-- iPhone 16 Pro frame-only overlay: the screen area is a real transparent
       cutout (via mask) so the media behind shows through. Logical size 402x874,
       screen corner radius 55pt, floating Dynamic Island (with camera). -->
  <defs>
    <linearGradient id="bezel16" x1="0" y1="0" x2="0" y2="874" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#74747a"/>
      <stop offset="1" stop-color="#2e2e31"/>
    </linearGradient>
    <linearGradient id="edgeHi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,0.42)"/>
      <stop offset="0.45" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="1" stop-color="rgba(0,0,0,0.30)"/>
    </linearGradient>
    <mask id="screen16">
      <rect x="0" y="0" width="402" height="874" fill="white"/>
      <rect x="14" y="14" width="374" height="846" rx="55" ry="55" fill="black"/>
    </mask>
  </defs>
  <!-- Outer body with the screen masked out to transparency. -->
  <rect x="6" y="6" width="390" height="862" rx="69" ry="69" fill="url(#bezel16)" stroke="#0a0a0a" stroke-width="2" mask="url(#screen16)"/>
  <!-- Screen edge rim: bright at the top (lit), dark at the bottom (AO). -->
  <rect x="14" y="14" width="374" height="846" rx="55" ry="55" fill="none" stroke="url(#edgeHi)" stroke-width="1.5"/>
  <!-- Dynamic Island with the front-facing camera lens. -->
  <rect x="153" y="20" width="96" height="28" rx="14" ry="14" fill="#0a0a0a"/>
  <circle cx="174" cy="34" r="6" fill="#15151a"/>
  <circle cx="174" cy="34" r="2.6" fill="#0a0a0a"/>
  <circle cx="172.6" cy="32.6" r="0.9" fill="rgba(255,255,255,0.5)"/>
  <!-- Side buttons (titanium) -->
  <rect x="0" y="172" width="6" height="30" rx="3" fill="#5a5a5d"/>
  <rect x="0" y="222" width="6" height="30" rx="3" fill="#5a5a5d"/>
  <rect x="396" y="194" width="6" height="58" rx="3" fill="#5a5a5d"/>
  <rect x="396" y="268" width="6" height="30" rx="3" fill="#5a5a5d"/>
  <!-- Antenna break lines in the titanium frame rails -->
  <g stroke="rgba(255,255,255,0.12)" stroke-width="1.5">
    <line x1="11" y1="122" x2="11" y2="152"/>
    <line x1="11" y1="722" x2="11" y2="752"/>
    <line x1="391" y1="122" x2="391" y2="152"/>
    <line x1="391" y1="722" x2="391" y2="752"/>
  </g>
</svg>
