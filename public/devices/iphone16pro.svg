<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" fill="none">
  <!-- iPhone 16 Pro frame-only overlay: transparent screen, Dynamic Island, titanium bezel -->
  <defs>
    <linearGradient id="bezel16" x1="0" y1="0" x2="390" y2="844" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6b6b6e"/>
      <stop offset="0.5" stop-color="#3a3a3c"/>
      <stop offset="1" stop-color="#5a5a5d"/>
    </linearGradient>
  </defs>
  <!-- Outer body -->
  <rect x="6" y="6" width="378" height="832" rx="56" ry="56" fill="url(#bezel16)" stroke="#0a0a0a" stroke-width="2"/>
  <!-- Inner screen cutout (transparent) -->
  <rect x="14" y="14" width="362" height="816" rx="48" ry="48" fill="#000000" fill-opacity="0"/>
  <!-- Screen edge highlight -->
  <rect x="14" y="14" width="362" height="816" rx="48" ry="48" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
  <!-- Dynamic Island -->
  <rect x="147" y="20" width="96" height="28" rx="14" ry="14" fill="#0a0a0a"/>
  <!-- Side buttons (titanium) -->
  <rect x="0" y="168" width="6" height="30" rx="3" fill="#5a5a5d"/>
  <rect x="0" y="216" width="6" height="30" rx="3" fill="#5a5a5d"/>
  <rect x="384" y="188" width="6" height="56" rx="3" fill="#5a5a5d"/>
  <rect x="384" y="260" width="6" height="30" rx="3" fill="#5a5a5d"/>
</svg>
