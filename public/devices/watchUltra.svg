<svg xmlns="http://www.w3.org/2000/svg" width="410" height="502" viewBox="0 0 410 502" fill="none">
  <!-- Apple Watch Ultra frame-only overlay: flat titanium case with a real
       transparent screen cutout (via mask) so the media shows through. Screen
       area matches the real 410x502 display. -->
  <defs>
    <linearGradient id="wu-case" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a8a90"/>
      <stop offset="0.5" stop-color="#4c4c52"/>
      <stop offset="1" stop-color="#6e6e75"/>
    </linearGradient>
    <mask id="wu-screen">
      <rect x="0" y="0" width="410" height="502" fill="white"/>
      <rect x="20" y="24" width="370" height="454" rx="82" ry="82" fill="black"/>
    </mask>
  </defs>
  <!-- Flat titanium case with the screen masked out to transparency -->
  <rect x="9" y="8" width="392" height="486" rx="110" ry="110" fill="url(#wu-case)" stroke="#0a0a0a" stroke-width="2" mask="url(#wu-screen)"/>
  <!-- Screen edge highlight (visible rim only) -->
  <rect x="20" y="24" width="370" height="454" rx="82" ry="82" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="1.5"/>
  <!-- Digital Crown with the signature international-orange ring -->
  <rect x="393" y="146" width="14" height="64" rx="7" fill="#3d3d42"/>
  <rect x="393" y="146" width="14" height="14" rx="7" fill="#ff5f1f"/>
  <!-- Side button -->
  <rect x="395" y="228" width="10" height="86" rx="5" fill="#3d3d42"/>
  <!-- Speaker grille (left side) -->
  <rect x="7" y="214" width="6" height="78" rx="3" fill="#333338"/>
</svg>
