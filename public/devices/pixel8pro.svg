<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" fill="none">
  <defs>
    <linearGradient id="bezelPixel" x1="0" y1="0" x2="390" y2="844" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#787880"/>
      <stop offset="0.5" stop-color="#3a3a3c"/>
      <stop offset="1" stop-color="#5c5c62"/>
    </linearGradient>
    <mask id="screenPixel">
      <rect x="0" y="0" width="390" height="844" fill="white"/>
      <rect x="14" y="14" width="362" height="816" rx="44" ry="44" fill="black"/>
    </mask>
  </defs>
  <!-- Outer body with the screen masked out to transparency. -->
  <rect x="6" y="6" width="378" height="832" rx="56" ry="56" fill="url(#bezelPixel)" stroke="#0a0a0a" stroke-width="2" mask="url(#screenPixel)"/>
  <!-- Screen edge highlight -->
  <rect x="14" y="14" width="362" height="816" rx="44" ry="44" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <!-- Centered punch-hole camera -->
  <circle cx="195" cy="34" r="7" fill="#0a0a0a"/>
  <circle cx="195" cy="34" r="4" fill="#1c1c1e"/>
  <!-- Power button (right) -->
  <rect x="384" y="195" width="6" height="52" rx="3" fill="#5c5c62"/>
  <!-- Volume buttons (left) -->
  <rect x="0" y="178" width="6" height="28" rx="3" fill="#5c5c62"/>
  <rect x="0" y="216" width="6" height="28" rx="3" fill="#5c5c62"/>
</svg>
