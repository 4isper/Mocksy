<svg xmlns="http://www.w3.org/2000/svg" width="448" height="996" viewBox="0 0 448 996" fill="none">
  <!-- Pixel 8 Pro overlay at its real logical size (448x996 dp). Screen corner
       radius follows the device (~34pt, tighter than the iPhone), uniform thin
       bezel, centered punch-hole front camera. -->
  <defs>
    <linearGradient id="bezelPixel" x1="0" y1="0" x2="448" y2="996" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#787880"/>
      <stop offset="0.5" stop-color="#3a3a3c"/>
      <stop offset="1" stop-color="#5c5c62"/>
    </linearGradient>
    <mask id="screenPixel">
      <rect x="0" y="0" width="448" height="996" fill="white"/>
      <rect x="14" y="14" width="420" height="968" rx="34" ry="34" fill="black"/>
    </mask>
  </defs>
  <!-- Outer body with the screen masked out to transparency. -->
  <rect x="6" y="6" width="436" height="984" rx="48" ry="48" fill="url(#bezelPixel)" stroke="#0a0a0a" stroke-width="2" mask="url(#screenPixel)"/>
  <!-- Screen edge highlight -->
  <rect x="14" y="14" width="420" height="968" rx="34" ry="34" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <!-- Earpiece slit (top center) -->
  <rect x="200" y="9" width="48" height="4" rx="2" fill="#0a0a0a"/>
  <!-- Centered punch-hole camera -->
  <circle cx="224" cy="34" r="7" fill="#0a0a0a"/>
  <circle cx="224" cy="34" r="4" fill="#1c1c1e"/>
  <circle cx="224" cy="34" r="1.6" fill="#0a0a0a"/>
  <!-- Power button (right) -->
  <rect x="442" y="230" width="6" height="52" rx="3" fill="#5c5c62"/>
  <!-- Volume buttons (left) -->
  <rect x="0" y="210" width="6" height="28" rx="3" fill="#5c5c62"/>
  <rect x="0" y="256" width="6" height="28" rx="3" fill="#5c5c62"/>
  <!-- Antenna break lines in the frame rails -->
  <g stroke="rgba(255,255,255,0.10)" stroke-width="1.5">
    <line x1="12" y1="160" x2="12" y2="196"/>
    <line x1="12" y1="800" x2="12" y2="836"/>
    <line x1="436" y1="160" x2="436" y2="196"/>
    <line x1="436" y1="800" x2="436" y2="836"/>
  </g>
</svg>
