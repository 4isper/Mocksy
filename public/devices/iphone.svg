  <!-- Subtle lens reflection ring -->
  <circle cx="168" cy="34" r="5.3" fill="none" stroke="rgba(150,170,190,0.30)" stroke-width="0.8"/>
  <!-- Side buttons -->
  <rect x="0" y="170" width="6" height="32" rx="3" fill="#2c2c2e"/>
  <rect x="0" y="220" width="6" height="32" rx="3" fill="#2c2c2e"/>
