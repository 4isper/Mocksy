<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" fill="none">
  <!-- Generic iPhone frame-only overlay: the screen area is a real transparent
       cutout (via mask) so the media behind shows through. Screen corner
       radius 55pt matches the physical device; a floating Dynamic Island
       (with the front camera) replaces the old notch. -->
  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="844" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4a4a4e"/>
      <stop offset="1" stop-color="#1a1a1c"/>
    </linearGradient>
    <!-- Directional screen-edge rim: bright at the top (lit), dark at the
         bottom (ambient occlusion) — instead of a uniform white ring. -->
    <linearGradient id="edgeHi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,0.40)"/>
      <stop offset="0.45" stop-color="rgba(255,255,255,0.05)"/>
      <stop offset="1" stop-color="rgba(0,0,0,0.30)"/>
    </linearGradient>
    <mask id="screen">
      <rect x="0" y="0" width="390" height="844" fill="white"/>
      <rect x="14" y="14" width="362" height="816" rx="55" ry="55" fill="black"/>
    </mask>
  </defs>
  <!-- Outer body with the screen masked out to transparency. -->
  <rect x="6" y="6" width="378" height="832" rx="69" ry="69" fill="url(#bezel)" stroke="#0a0a0a" stroke-width="2" mask="url(#screen)"/>
  <!-- Screen edge highlight (only the visible rim, not the cutout interior). -->
  <rect x="14" y="14" width="362" height="816" rx="55" ry="55" fill="none" stroke="url(#edgeHi)" stroke-width="1.5"/>
  <!-- Dynamic Island with the front-facing camera lens. -->
  <rect x="147" y="20" width="96" height="28" rx="14" ry="14" fill="#0a0a0a"/>
  <circle cx="168" cy="34" r="6" fill="#15151a"/>
  <circle cx="168" cy="34" r="2.6" fill="#0a0a0a"/>
  <circle cx="166.6" cy="32.6" r="0.9" fill="rgba(255,255,255,0.5)"/>
  <!-- Side buttons -->
  <rect x="0" y="170" width="6" height="32" rx="3" fill="#2c2c2e"/>
  <rect x="0" y="220" width="6" height="32" rx="3" fill="#2c2c2e"/>
  <rect x="384" y="190" width="6" height="58" rx="3" fill="#2c2c2e"/>
  <rect x="384" y="264" width="6" height="32" rx="3" fill="#2c2c2e"/>
  <!-- Antenna break lines in the metal frame rails -->
  <g stroke="rgba(255,255,255,0.10)" stroke-width="1.5">
    <line x1="10" y1="120" x2="10" y2="150"/>
    <line x1="10" y1="694" x2="10" y2="724"/>
    <line x1="380" y1="120" x2="380" y2="150"/>
    <line x1="380" y1="694" x2="380" y2="724"/>
  </g>
</svg>
