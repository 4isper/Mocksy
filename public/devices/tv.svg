<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" fill="none">
  <!-- TV frame-only overlay: a thin uniform bezel around a 16:9 screen with two
       feet, like a modern flatscreen. The screen area is a real transparent
       cutout (via mask) so the media behind shows through. -->
  <defs>
    <linearGradient id="tv-bezel" x1="0" y1="0" x2="0" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#333338"/>
      <stop offset="1" stop-color="#17171a"/>
    </linearGradient>
    <linearGradient id="tv-foot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2c30"/>
      <stop offset="1" stop-color="#101013"/>
    </linearGradient>
    <mask id="tv-screen">
      <rect x="0" y="0" width="1600" height="1000" fill="white"/>
      <rect x="40" y="40" width="1520" height="855" rx="6" ry="6" fill="black"/>
    </mask>
  </defs>
  <!-- Bezel with the screen masked out to transparency -->
  <rect x="20" y="20" width="1560" height="895" rx="14" ry="14" fill="url(#tv-bezel)" stroke="#0a0a0a" stroke-width="2" mask="url(#tv-screen)"/>
  <!-- Screen edge highlight (visible rim only) -->
  <rect x="40" y="40" width="1520" height="855" rx="6" ry="6" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
  <!-- Power LED (bottom bezel, right) -->
  <circle cx="1540" cy="885" r="3" fill="#0a0a0a"/>
  <circle cx="1540" cy="885" r="1.4" fill="#28c840"/>
  <!-- Two feet -->
  <path d="M610 915 L650 915 L640 960 L600 960 Z" fill="url(#tv-foot)"/>
  <path d="M950 915 L990 915 L1000 960 L960 960 Z" fill="url(#tv-foot)"/>
  <rect x="560" y="952" width="480" height="30" rx="15" fill="url(#tv-foot)" stroke="#0a0a0a" stroke-width="2"/>
</svg>
