<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" fill="none">
  <!-- TV frame-only overlay: the screen area is a real transparent cutout
       (via mask) so the media behind shows through. -->
  <defs>
    <linearGradient id="tv-bezel" x1="0" y1="0" x2="0" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#333338"/>
      <stop offset="1" stop-color="#17171a"/>
    </linearGradient>
    <linearGradient id="tv-stand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2c30"/>
      <stop offset="1" stop-color="#101013"/>
    </linearGradient>
    <mask id="tv-screen">
      <rect x="0" y="0" width="1600" height="1000" fill="white"/>
      <rect x="40" y="24" width="1520" height="855" rx="12" ry="12" fill="black"/>
    </mask>
  </defs>
  <!-- Bezel with the screen masked out to transparency -->
  <rect x="20" y="4" width="1560" height="895" rx="20" ry="20" fill="url(#tv-bezel)" stroke="#0a0a0a" stroke-width="2" mask="url(#tv-screen)"/>
  <!-- Screen edge highlight (visible rim only) -->
  <rect x="40" y="24" width="1520" height="855" rx="12" ry="12" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
  <!-- Power LED (bottom bezel, right) -->
  <circle cx="1540" cy="885" r="3" fill="#0a0a0a"/>
  <circle cx="1540" cy="885" r="1.4" fill="#28c840"/>
  <!-- Stand: center neck + base -->
  <path d="M770 899 H830 V925 Q800 949 770 925 Z" fill="url(#tv-stand)"/>
  <rect x="610" y="944" width="380" height="34" rx="17" fill="url(#tv-stand)" stroke="#0a0a0a" stroke-width="2"/>
</svg>
