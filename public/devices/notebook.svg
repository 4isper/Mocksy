<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" fill="none">
  <!-- Generic notebook (Windows laptop) frame-only overlay: the display is a
       real transparent cutout (via mask) so the media behind shows through. -->
  <defs>
    <linearGradient id="nb-lid" x1="0" y1="0" x2="0" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4c4c52"/>
      <stop offset="1" stop-color="#2a2a30"/>
    </linearGradient>
    <linearGradient id="nb-base" x1="0" y1="0" x2="0" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3c3c42"/>
      <stop offset="1" stop-color="#1e1e24"/>
    </linearGradient>
    <mask id="nb-screen">
      <rect x="0" y="0" width="1600" height="1000" fill="white"/>
      <rect x="80" y="40" width="1440" height="810" rx="8" ry="8" fill="black"/>
    </mask>
  </defs>
  <!-- Lid: the front slab with the display masked out. -->
  <rect x="40" y="20" width="1520" height="870" rx="24" ry="24" fill="url(#nb-lid)" stroke="#0a0a0a" stroke-width="2" mask="url(#nb-screen)"/>
  <!-- Display edge highlight -->
  <rect x="80" y="40" width="1440" height="810" rx="8" ry="8" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
  <!-- Camera above the display cutout -->
  <circle cx="800" cy="30" r="2.5" fill="#0a0a0a"/>
  <!-- Bottom base (keyboard deck) with the hinge seam -->
  <rect x="40" y="890" width="1520" height="104" rx="18" ry="18" fill="url(#nb-base)"/>
  <rect x="40" y="888" width="1520" height="3" fill="rgba(255,255,255,0.08)"/>
  <!-- Keyboard deck hint -->
  <rect x="220" y="900" width="1160" height="50" rx="8" fill="rgba(255,255,255,0.05)"/>
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="244" y1="916" x2="1356" y2="916"/>
    <line x1="244" y1="932" x2="1356" y2="932"/>
    <line x1="244" y1="948" x2="1356" y2="948"/>
  </g>
  <!-- Trackpad -->
  <rect x="700" y="962" width="200" height="24" rx="6" fill="rgba(255,255,255,0.07)"/>
</svg>
