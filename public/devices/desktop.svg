<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" fill="none">
  <!-- Generic desktop monitor overlay: a thin uniform-bezel screen on a stand.
       The screen area is a real transparent cutout (via mask) so the media
       behind shows through. -->
  <defs>
    <linearGradient id="dt-bezel" x1="0" y1="0" x2="0" y2="920" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3a3a40"/>
      <stop offset="1" stop-color="#121214"/>
    </linearGradient>
    <linearGradient id="edgeHi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,0.30)"/>
      <stop offset="0.45" stop-color="rgba(255,255,255,0.04)"/>
      <stop offset="1" stop-color="rgba(0,0,0,0.24)"/>
    </linearGradient>
    <linearGradient id="dt-stand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2c30"/>
      <stop offset="1" stop-color="#101013"/>
    </linearGradient>
    <mask id="dt-screen">
      <rect x="0" y="0" width="1600" height="1000" fill="white"/>
      <rect x="40" y="40" width="1520" height="840" rx="8" ry="8" fill="black"/>
    </mask>
  </defs>
  <!-- Panel with the screen masked out to transparency -->
  <rect x="20" y="20" width="1560" height="900" rx="18" ry="18" fill="url(#dt-bezel)" stroke="#0a0a0a" stroke-width="2" mask="url(#dt-screen)"/>
  <!-- Screen edge rim: bright top / dark bottom -->
  <rect x="40" y="40" width="1520" height="840" rx="8" ry="8" fill="none" stroke="url(#edgeHi)" stroke-width="1.5"/>
  <!-- Front camera (top bezel, center) -->
  <circle cx="800" cy="30" r="3" fill="#0a0a0a"/>
  <circle cx="800" cy="30" r="1.3" fill="#15151a"/>
  <!-- Stand neck -->
  <rect x="750" y="918" width="100" height="44" rx="6" fill="url(#dt-stand)"/>
  <!-- Stand foot -->
  <rect x="560" y="956" width="480" height="34" rx="17" fill="url(#dt-stand)" stroke="#0a0a0a" stroke-width="2"/>
</svg>
