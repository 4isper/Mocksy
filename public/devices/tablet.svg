<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" fill="none">
  <!-- Generic tablet overlay: a thin uniform bezel with a front camera and a
       home-indicator bar. The screen area is a real transparent cutout (via
       mask) so the media behind shows through. -->
  <defs>
    <linearGradient id="tb-bezel" x1="0" y1="0" x2="0" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4a4a4e"/>
      <stop offset="1" stop-color="#1a1a1c"/>
    </linearGradient>
    <linearGradient id="edgeHi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,0.32)"/>
      <stop offset="0.45" stop-color="rgba(255,255,255,0.04)"/>
      <stop offset="1" stop-color="rgba(0,0,0,0.26)"/>
    </linearGradient>
    <mask id="tb-screen">
      <rect x="0" y="0" width="1200" height="900" fill="white"/>
      <rect x="40" y="30" width="1120" height="840" rx="24" ry="24" fill="black"/>
    </mask>
  </defs>
  <!-- Body with the screen masked out to transparency -->
  <rect x="10" y="10" width="1180" height="880" rx="34" ry="34" fill="url(#tb-bezel)" stroke="#0a0a0a" stroke-width="2" mask="url(#tb-screen)"/>
  <!-- Screen edge rim: bright top / dark bottom -->
  <rect x="40" y="30" width="1120" height="840" rx="24" ry="24" fill="none" stroke="url(#edgeHi)" stroke-width="1.5"/>
  <!-- Front camera (top bezel, center) -->
  <circle cx="600" cy="20" r="3" fill="#0a0a0a"/>
  <circle cx="600" cy="20" r="1.3" fill="#15151a"/>
  <!-- Side buttons -->
  <rect x="0" y="300" width="6" height="60" rx="3" fill="#2c2c2e"/>
  <rect x="0" y="380" width="6" height="60" rx="3" fill="#2c2c2e"/>
  <rect x="1194" y="340" width="6" height="80" rx="3" fill="#2c2c2e"/>
  <!-- Home indicator bar -->
  <rect x="500" y="852" width="200" height="8" rx="4" fill="rgba(255,255,255,0.5)"/>
</svg>
