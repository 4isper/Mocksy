name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  NODE_VERSION: "22"
  BASE_URL: "http://localhost:3000"
  PORT: "3000"

jobs:
  lint-and-typecheck:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Audit (allowlisted advisories)
        run: npm run audit

      - name: i18n sync check
        run: npm run i18n:sync -- --check

  unit-tests:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test

  e2e-tests:
    name: E2E (Playwright)
    # macOS runner: Linux headless chromium with SwiftShader doesn't deliver
    # canvas.captureStream() frames reliably, which breaks the video export
    # tests there. macOS is slow but works; retries absorb its speed variance.
    runs-on: macos-latest
    needs: [lint-and-typecheck, unit-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Build Next.js app
        run: npm run build

      - name: Start production server
        run: |
          PORT=${{ env.PORT }} npm start > /dev/null 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:${{ env.PORT }}/en > /dev/null && break
            sleep 1
          done

      - name: Run E2E tests
        run: npx playwright test --project=chromium

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/

  visual-regression:
    name: Visual regression (VRT)
    # VRT baselines are darwin-specific (font rendering); macOS runners are
    # also slower/more contended, so keep the flaky editor suite on ubuntu.
    runs-on: macos-latest
    needs: [lint-and-typecheck, unit-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Build Next.js app
        run: npm run build

      - name: Start production server
        run: |
          PORT=${{ env.PORT }} npm start > /dev/null 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:${{ env.PORT }}/en > /dev/null && break
            sleep 1
          done

      - name: Run visual regression tests
        run: npx playwright test --project=chromium-vrt

      - name: Upload visual diff report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-vrt-diff
          path: test-results/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-vrt-results
          path: test-results/

  og-image:
    name: OG image freshness
    # macOS to match the font rendering of the committed public/og-image.png
    # (scripts/generate-og.mjs screenshots with system fonts).
    runs-on: macos-latest
    needs: [lint-and-typecheck, unit-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Regenerate public/og-image.png
        run: node scripts/generate-og.mjs

      - name: Fail if the committed OG image is stale
        run: git diff --exit-code -- public/og-image.png

      - name: Upload refreshed image on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: og-image-refreshed
          path: public/og-image.png

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build

      - name: Start production server
        run: |
          PORT=${{ env.PORT }} npm start > /dev/null 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:${{ env.PORT }}/en > /dev/null && break
            sleep 1
          done

      - name: Run Lighthouse CI
        run: npx lhci autorun
